name: DI diagnostics
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: normlanguage/registry/.github/actions/setup-norm@d229852448570c786a3f86e62c7db36769ed9a18
        with:
          source-ref: fa1a4db1a47fdca2ddbe735f770e185f7042e28b
      - name: Package
        shell: bash
        run: norm package di/module.norm --output build/repository
      - name: Run tests and dump generated output
        shell: bash
        run: |
          set +e
          norm test di
          status=$?
          echo "TEST_STATUS=$status"
          find build -type f \( -path '*/META-INF/services/*' -o -name '*$Definition*' -o -path '*/generated-sources/*' \) -print | sort
          find build/norm/java -type f -maxdepth 8 -print 2>/dev/null | sort || true
          exit $status
