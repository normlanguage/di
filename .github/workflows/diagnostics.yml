name: DI diagnostics
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: normlanguage/registry/.github/actions/setup-norm@d229852448570c786a3f86e62c7db36769ed9a18
        with:
          source-ref: 77f90224850a8841af99c927463d3c6ef4af140a
      - name: Package
        shell: bash
        run: norm package di/module.norm --output build/repository
      - name: Run tests and dump generated output
        shell: bash
        run: |
          set +e
          echo '--- generated resources before test ---'
          find "$HOME/.norm" -type f -path '*/META-INF/micronaut/io.micronaut.inject.BeanDefinitionReference/*' -print 2>/dev/null | sort | tail -n 200 || true
          echo '--- generated resources before test (workspace) ---'
          find . -type f -path '*/META-INF/micronaut/io.micronaut.inject.BeanDefinitionReference/*' -print 2>/dev/null | sort | tail -n 200 || true
          norm test di
          status=$?
          echo "TEST_STATUS=$status"
          echo '--- generated resources after test ---'
          find "$HOME/.norm" -type f -path '*/META-INF/micronaut/io.micronaut.inject.BeanDefinitionReference/*' -print 2>/dev/null | sort | tail -n 200 || true
          find build -type f \( -path '*/META-INF/services/*' -o -name '*$Definition*' -o -path '*/generated-sources/*' \) -print | sort
          find build/norm/java -type f -maxdepth 8 -print 2>/dev/null | sort || true
          exit $status
